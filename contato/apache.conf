# Dentro do <VirtualHost *:443> do arreis.com.br (httpd-vhosts.conf),
# junto ao <Directory>. proxy_module e proxy_http_module já ativos.
# 172.21.0.1 = gateway da rede apache_default (o host, visto do container).
ProxyPass        /api/contato http://172.21.0.1:8787/api/contato
ProxyPassReverse /api/contato http://172.21.0.1:8787/api/contato
